<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Progress Timer</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  background: white;
  color: black;
  text-align: center;
}

#app {
  padding: 25px;
}

h1 {
  font-size: 42px;
  margin: 10px 0;
}

#percent {
  font-size: 150px;
  font-weight: bold;
  margin: 15px 0;
}

#bar {
  width: 90%;
  height: 45px;
  border: 4px solid black;
  margin: 20px auto;
  border-radius: 25px;
  overflow: hidden;
}

#fill {
  height: 100%;
  width: 0%;
  background: black;
}

.times {
  font-size: 30px;
  font-weight: bold;
  margin: 15px;
}

.controls {
  margin-top: 25px;
}

button, input {
  font-size: 22px;
  padding: 10px 14px;
  margin: 5px;
}

button {
  background: black;
  color: white;
  border: 2px solid black;
  border-radius: 8px;
}

input {
  width: 80px;
  text-align: center;
}

body.dark {
  background: black;
  color: white;
}

body.dark #bar {
  border-color: white;
}

body.dark #fill {
  background: white;
}

body.dark button {
  background: white;
  color: black;
  border-color: white;
}

body.dark input {
  background: black;
  color: white;
  border: 2px solid white;
}
</style>
</head>

<body>

<div id="app">

<h1>WORKOUT PROGRESS</h1>

<div id="percent">0%</div>

<div id="bar">
  <div id="fill"></div>
</div>

<div class="times">
  ELAPSED:
  <span id="elapsed">00:00</span>
</div>

<div class="times">
  REMAINING:
  <span id="remaining">50:00</span>
</div>

<div class="controls">

  Minutes:
  <input id="minutes" type="number" value="50" min="1">

  <br>

  <button onclick="startTimer()">START</button>
  <button onclick="pauseTimer()">PAUSE</button>
  <button onclick="resetTimer()">RESET</button>

  <br>

  <button onclick="toggleTheme()" id="themeButton">
    DARK MODE
  </button>

  <button onclick="goFullscreen()">
    FULL SCREEN
  </button>

</div>

</div>

<script>

var totalSeconds = 50 * 60;
var elapsedSeconds = 0;
var timer = null;

function twoDigits(number) {
  if (number < 10) {
    return "0" + number;
  }
  return number;
}

function formatTime(seconds) {

  seconds = Math.round(seconds);

  var minutes = Math.floor(seconds / 60);
  var secs = seconds % 60;

  return twoDigits(minutes) + ":" + twoDigits(secs);
}

function updateScreen() {

  var percent =
    Math.floor((elapsedSeconds / totalSeconds) * 100);

  if (percent > 100) {
    percent = 100;
  }

  document.getElementById("percent").innerHTML =
    percent + "%";

  document.getElementById("fill").style.width =
    percent + "%";

  document.getElementById("elapsed").innerHTML =
    formatTime(elapsedSeconds);

  document.getElementById("remaining").innerHTML =
    formatTime(totalSeconds - elapsedSeconds);

  if (elapsedSeconds >= totalSeconds) {

    clearInterval(timer);
    timer = null;

    document.getElementById("percent").innerHTML =
      "100% DONE!";
  }
}

function startTimer() {

  if (timer !== null) {
    return;
  }

  var minutes =
    parseInt(document.getElementById("minutes").value, 10);

  if (elapsedSeconds === 0) {
    totalSeconds = minutes * 60;
  }

  timer = setInterval(function() {

    elapsedSeconds++;

    if (elapsedSeconds >= totalSeconds) {
      elapsedSeconds = totalSeconds;
    }

    updateScreen();

  }, 1000);
}

function pauseTimer() {

  clearInterval(timer);
  timer = null;
}

function resetTimer() {

  clearInterval(timer);
  timer = null;

  var minutes =
    parseInt(document.getElementById("minutes").value, 10);

  totalSeconds = minutes * 60;
  elapsedSeconds = 0;

  updateScreen();
}

function toggleTheme() {

  var body = document.body;
  var button =
    document.getElementById("themeButton");

  if (body.className === "dark") {

    body.className = "";
    button.innerHTML = "DARK MODE";

  } else {

    body.className = "dark";
    button.innerHTML = "LIGHT MODE";
  }
}

function goFullscreen() {

  var page = document.documentElement;

  if (page.requestFullscreen) {
    page.requestFullscreen();
  }
  else if (page.webkitRequestFullscreen) {
    page.webkitRequestFullscreen();
  }
  else if (page.mozRequestFullScreen) {
    page.mozRequestFullScreen();
  }
}

updateScreen();

</script>

</body>
</htm
